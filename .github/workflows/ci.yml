name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - arena/01a10b72-game

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test game logic
        run: npm test
      - name: Verify production build
        run: npm run build
